<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="agentic-guardrail-ts: tool-enforced guardrails for coding agents">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="240" rx="24" fill="url(#bg)" />

  <g transform="translate(24, 24)">
    <circle cx="0" cy="0" r="6" fill="#ef4444" />
    <circle cx="20" cy="0" r="6" fill="#f59e0b" />
    <circle cx="40" cy="0" r="6" fill="#10b981" />
  </g>

  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0,40 L800,40 M0,80 L800,80 M0,120 L800,120 M0,160 L800,160 M0,200 L800,200" />
    <path d="M80,0 L80,240 M160,0 L160,240 M240,0 L240,240 M320,0 L320,240 M400,0 L400,240 M480,0 L480,240 M560,0 L560,240 M640,0 L640,240 M720,0 L720,240" />
  </g>

  <!-- Shield -->
  <g transform="translate(60, 40)" filter="url(#glow)">
    <path d="M70,10 L130,30 L130,80 C130,120 100,150 70,170 C40,150 10,120 10,80 L10,30 Z" fill="none" stroke="url(#shield)" stroke-width="8" stroke-linejoin="round" />
    <circle cx="70" cy="75" r="15" fill="url(#accent)" />
    <circle cx="45" cy="45" r="8" fill="#e2e8f0" />
    <circle cx="95" cy="45" r="8" fill="#e2e8f0" />
    <path d="M45,45 L70,75 L95,45" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <text x="70" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#e2e8f0" text-anchor="middle">TS</text>
  </g>

  <!-- Title -->
  <g filter="url(#glow)">
    <text x="228" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">agentic<tspan fill="url(#accent)">-guardrail-ts</tspan></text>
  </g>
  <text x="232" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="1">TOOL-ENFORCED GUARDRAILS FOR CODING AGENTS</text>

  <!-- The loop: every stage runs the same gate -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle">
    <g transform="translate(232, 162)">
      <rect width="64" height="26" rx="13" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.5" />
      <text x="32" y="17" fill="#7dd3fc">edit</text>
    </g>
    <text x="311" y="179" fill="#64748b">&#8594;</text>
    <g transform="translate(326, 162)">
      <rect width="64" height="26" rx="13" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.5" />
      <text x="32" y="17" fill="#93c5fd">stop</text>
    </g>
    <text x="405" y="179" fill="#64748b">&#8594;</text>
    <g transform="translate(420, 162)">
      <rect width="80" height="26" rx="13" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.5" />
      <text x="40" y="17" fill="#a5b4fc">commit</text>
    </g>
    <text x="515" y="179" fill="#64748b">&#8594;</text>
    <g transform="translate(530, 162)">
      <rect width="64" height="26" rx="13" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5" />
      <text x="32" y="17" fill="#c4b5fd">push</text>
    </g>
    <text x="609" y="179" fill="#64748b">&#8594;</text>
    <g transform="translate(624, 162)">
      <rect width="48" height="26" rx="13" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc" stroke-opacity="0.5" />
      <text x="24" y="17" fill="#d8b4fe">CI</text>
    </g>
  </g>
</svg>
